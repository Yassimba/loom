# The published loom tool manifest — the MENU of tools this setup can
# provide, every pin exact (no "latest", no ranges).
#
# What lands on a user machine is the SELECTION: the CLI writes only the
# core block plus wizard-chosen tools to ~/.config/mise/conf.d/loom.toml.
# `loom update` refreshes the pins of whatever is already selected;
# merging a change to this file on main is publishing. The weekly mise-bump
# workflow proposes pin updates as a PR. The pins of this repo's own
# binaries are written by release.yml once a release's assets are uploaded.
#
# Format rules the tooling relies on: one tool per line, and the core block
# stays between the core:begin/core:end markers (installers extract it with
# sed; the CLI treats everything outside it as optional).
#
# Machine-personal tools belong in the user's own ~/.config/mise/config.toml
# (the personal overlay), never here.

[tools]
# core:begin — always installed; everything the setup itself needs
node = "24.21.0"
"github:Yassimba/loom[exe=loom]" = { version = "loom-v1.14.4", tag_regex = "^loom-v" }
# core:end

# claude-obsidian: an Obsidian vault as the agent's wiki (wiki, save, think,
# canvas, autoresearch skills + their Python core). The release zip is the
# whole product, so `mise where github:AgriciDaniel/claude-obsidian` is the
# product root its skills resolve scripts from.
"github:AgriciDaniel/claude-obsidian" = "v2.2.0"
python = "3.14.8"

# teams calendar CLI (export meetings as JSON, find slots). Same GitHub
# releases as loom, but through the ubi backend: mise keys an install by
# backend + repo, so two `github:` entries for one repo share a store dir and
# one metadata file — the last install wins the exe, and `mise prune` deletes
# the other's version as unreferenced.
"ubi:Yassimba/loom" = { version = "loom-teams-v0.2.4", exe = "loom-teams", tag_regex = "^loom-teams-v" }

# agents & multiplexer
"npm:@earendil-works/pi-coding-agent" = "1.0.0"
# Herdr Annotate actions and the Mermaid document CLI run on Bun.
bun = "1.4.2"
# herdr ships no stable Windows assets yet; on Windows the CLI keeps its
# manual install instruction and mise skips this entry.
herdr = { version = "0.9.3", os = ["macos", "linux"] }

# semantic Git history, diffs, and change impact
"github:Ataraxy-Labs/sem[exe=sem]" = "v0.25.0"

# persistent local repository graph and impact analysis
"npm:codebase-memory-mcp" = "0.11.0"

# compress command output for coding agents
"github:rtk-ai/rtk" = "v0.50.0"

# local inference server for Apple silicon Macs
"npm:@magnitudedev/cli" = { version = "0.0.15", os = ["macos"] }

# hardware-aware local model TUI for Linux and Windows
"ubi:AlexsJones/llmfit" = { version = "v1.1.16", os = ["linux", "windows"] }

# local hybrid search for Markdown knowledge bases
"npm:@tobilu/qmd" = "2.8.3"

# code review TUI (annotate diffs, export to GitHub or clipboard)
"github:agavra/tuicr" = "v0.27.0"

# browser-based plan and code review for coding agents
"github:backnotprop/plannotator" = "v0.27.23"

# forges
gh = "2.102.0"
"github:ankitpokhrel/jira-cli[exe=jira]" = "v1.7.0"
glab = "1.120.0"
"github:rcieri/glab-tui" = "v0.9.2"

# hygiene & navigation
gitleaks = "8.30.1"
zoxide = "0.10.0"
# envx per OS: native release binaries where upstream ships them; only
# macos (no arm64 asset upstream) builds from crates.io (published as
# `envex`, binary `envx`). One wizard tool, companion keys.
"github:mikeleppane/envx" = { version = "v0.6.2", os = ["linux", "windows"] }
"cargo:envex" = { version = "0.6.2", os = ["macos"] }
# Cargo fallbacks for envx and tokei need a toolchain; companion metadata
# pulls this in only with those tools, and only on macOS.
rust = { version = "1.99.0", os = ["macos"] }

# observability
"github:DataDog/pup" = "v1.23.6"

# export Confluence pages and spaces to Markdown
"pipx:confluence-markdown-exporter" = "5.5.0"

# code stats (tokei 13+ publishes no prebuilt binaries; 12.1.2 is the last
# release with assets). macOS arm64 has no asset, so it builds via cargo.
"aqua:XAMPPRocky/tokei" = { version = "12.1.2", os = ["linux", "windows"] }
"cargo:tokei" = { version = "15.0.0", os = ["macos"] }
"github:zdyxry/tokui" = "0.12.0"

# issue tracking for agents (beads: br is the tracker, bv the TUI viewer)
"github:Dicklesworthstone/beads_rust" = "v0.7.3"
"github:Dicklesworthstone/beads_viewer" = "v0.25.1"

# python toolchain
uv = "0.12.21"

# skill tooling (browser automation, diagram/slide export)
"npm:agent-browser" = "0.38.2"
"npm:@mermaid-js/mermaid-cli" = "12.0.0"
