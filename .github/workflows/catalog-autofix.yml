name: Catalog autofix

# cli/loom/setup-catalog.json embeds Pi package versions, so a Renovate
# bump to manifest/pi-packages.json leaves the committed catalog stale
# and catalog:check red. This regenerates it and pushes the fix to the
# PR branch. Needs the AUTOFIX_TOKEN secret (fine-grained PAT with
# contents: write): commits pushed with the default GITHUB_TOKEN do not
# re-trigger required checks, which would strand the PR.
# Loop-safe: the fix commit's own run finds a fresh catalog and pushes
# nothing.

on:
  pull_request:
    paths:
      - "manifest/pi-packages.json"

permissions:
  contents: read

jobs:
  regenerate:
    # same-repo PRs only: fork PRs have no secrets and are not our bots
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.AUTOFIX_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate the catalog if stale
        run: |
          if npm run catalog:check; then
            echo "Catalog already fresh."
            exit 0
          fi
          npm run catalog:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: regenerate setup catalog for pin bump"
          git push
