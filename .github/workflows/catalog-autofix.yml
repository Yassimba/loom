name: Catalog autofix

# cli/loom/setup-catalog.json embeds Pi package versions, so a Renovate
# bump to manifest/pi-packages.json leaves the committed catalog stale
# and catalog:check red. This regenerates it and pushes the fix to the
# PR branch over the AUTOFIX_SSH_KEY deploy key: deploy-key pushes
# re-trigger required checks, which pushes with the default
# GITHUB_TOKEN would not, stranding the PR.
# Loop-safe: the fix commit's own run finds a fresh catalog and pushes
# nothing.

on:
  pull_request:
    paths:
      - "manifest/pi-packages.json"

permissions:
  contents: read

jobs:
  regenerate:
    # same-repo PRs only: fork PRs have no secrets and are not our bots
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          ssh-key: ${{ secrets.AUTOFIX_SSH_KEY }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate the catalog if stale
        run: |
          npm run catalog:check && exit 0
          npm run catalog:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: regenerate setup catalog for pin bump"
          git push
