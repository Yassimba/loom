name: mise-bump

# Weekly pin bumps for the published tool manifest and the contributor dev
# env. Merging the PR is publishing: `loom update` reads main. The repo's
# own binaries only ever bump to their latest tag, which release-please
# already wrote when it released them.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@5083fe46898c414b2475087cc79da59e7da859e8 # v2.1.11
        with:
          install: false
      - name: Bump contributor dev-env pins (./mise.toml)
        run: mise upgrade --bump
        env:
          MISE_YES: "1"
      - name: Bump manifest pins (manifest/loom.toml)
        run: mise upgrade --bump
        env:
          MISE_YES: "1"
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/manifest/loom.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - name: Bump Pi package pins (manifest/pi-packages.json)
        # Newest version at least 5 days old, matching Renovate's
        # minimumReleaseAge: young releases wait a week for malware
        # researchers and scanners before landing in the manifest.
        run: |
          python3 - <<'EOF'
          import json, subprocess
          from datetime import datetime, timedelta, timezone
          path = "manifest/pi-packages.json"
          cutoff = datetime.now(timezone.utc) - timedelta(days=5)
          data = json.load(open(path))
          for package in data["packages"]:
              if "version" not in package:
                  continue
              out = subprocess.run(
                  ["npm", "view", package["name"], "time", "--json"],
                  capture_output=True, text=True,
              ).stdout
              if not out:
                  continue
              times = json.loads(out)
              aged = [
                  version for version, stamp in times.items()
                  if version not in ("created", "modified")
                  and "-" not in version  # skip prereleases
                  and datetime.fromisoformat(stamp.replace("Z", "+00:00")) <= cutoff
              ]
              key = lambda v: [int(p) for p in v.split(".")]
              if aged:
                  pick = max(aged, key=key)
                  # never downgrade a pin that is already ahead of the aged pick
                  if key(pick) > key(package["version"]):
                      package["version"] = pick
          with open(path, "w") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          EOF
      - name: Refresh generated setup catalog
        run: |
          npm ci
          npm run catalog:generate
      - name: Open bump PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: mise/bump
          title: "chore(tools): bump mise pins"
          commit-message: "chore(tools): bump mise pins"
          body: |
            Weekly `mise upgrade --bump` across `mise.toml` and
            `manifest/loom.toml`. Merging publishes the new pins —
            `loom update` syncs the manifest from main.
          delete-branch: true
