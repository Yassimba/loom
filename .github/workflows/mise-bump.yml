name: mise-bump

# Weekly pin bumps for the published tool manifest and the contributor dev
# env. Merging the PR is publishing: `loom update` reads main. The
# repo's own binaries (loom, stackdiff) are excluded — their pins move
# with their releases via plan-releases.mjs.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false
      - name: Bump contributor dev-env pins (./mise.toml)
        run: mise upgrade --bump
        env:
          MISE_YES: "1"
      - name: Bump manifest pins (manifest/loom.toml)
        run: mise upgrade --bump
        env:
          MISE_YES: "1"
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/manifest/loom.toml
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - name: Bump Pi package pins (manifest/pi-packages.json)
        run: |
          python3 - <<'EOF'
          import json, subprocess
          path = "manifest/pi-packages.json"
          data = json.load(open(path))
          for package in data["packages"]:
              latest = subprocess.run(
                  ["npm", "view", package["name"], "version"],
                  capture_output=True, text=True,
              ).stdout.strip()
              if latest:
                  package["version"] = latest
          with open(path, "w") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          EOF
      - name: Restore release-owned pins
        run: |
          python3 - <<'EOF'
          import re, subprocess
          path = "manifest/loom.toml"
          current = open(path).read()
          published = subprocess.run(
              ["git", "show", f"HEAD:{path}"], capture_output=True, text=True
          ).stdout
          for exe in ("loom", "stackdiff"):
              pattern = rf'^"github:Yassimba/loom\[exe={exe}\]" = .*$'
              keep = re.search(pattern, published, re.M)
              if keep:
                  current = re.sub(pattern, lambda _: keep.group(0), current, flags=re.M)
          open(path, "w").write(current)
          EOF
      - name: Open bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v6.1.0
        with:
          branch: mise/bump
          title: "chore(tools): bump mise pins"
          commit-message: "chore(tools): bump mise pins"
          body: |
            Weekly `mise upgrade --bump` across `mise.toml` and
            `manifest/loom.toml`. Merging publishes the new pins —
            `loom update` syncs the manifest from main. Release-owned
            pins (loom, stackdiff) are restored to their released
            versions before the PR is opened.
          delete-branch: true
