name: Full install smoke

on:
  pull_request:
    paths:
      - .github/workflows/full-install.yml
      - install.ps1
      - install.sh
      - manifest/**
      - scripts/e2e-install-*.ps1
      - scripts/e2e-install-*.sh
      - setup-catalog.json
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [Publish semantic release plan]
    types: [completed]

permissions:
  contents: read

jobs:
  unix:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release/auto')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run the real bootstrap twice
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/e2e-install-unix.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: warn

  windows:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release/auto')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            engine: powershell
            skill: next
            tokei: required
          - name: Windows ARM64
            runner: windows-11-arm
            engine: pwsh
            skill: tdd
            tokei: skip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run the real bootstrap twice
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOM_E2E_POWERSHELL: ${{ matrix.engine }}
          LOOM_E2E_SKILL: ${{ matrix.skill }}
          LOOM_E2E_TOKEI: ${{ matrix.tokei }}
        run: .\scripts\e2e-install-windows.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: warn
