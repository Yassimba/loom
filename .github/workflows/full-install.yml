name: Full install smoke

on:
  pull_request:
    paths:
      - .github/workflows/full-install.yml
      - install.ps1
      - install.sh
      - manifest/**
      - scripts/e2e-install-*.ps1
      - scripts/e2e-install-*.sh
      - scripts/e2e-windows-*.py
      - cli/loom/**
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Called by release.yml once a release's binaries are uploaded.
  workflow_call:
    inputs:
      published:
        description: Exercise published binaries instead of building a candidate
        type: boolean
        default: false
      checkout_ref:
        description: Git ref to test after release pinning
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux-loom:
    if: ${{ !inputs.published }}
    name: Build Loom for WSL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-linux-x64
          path: cli/loom/target/release/loom

  windows-wsl:
    if: ${{ !inputs.published }}
    name: Windows UX and WSL2
    needs: linux-loom
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
      - name: Drive the native Windows prompt through ConPTY
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.5
          python scripts/e2e-windows-console.py cli/loom/target/release/loom.exe $env:RUNNER_TEMP/loom-windows-e2e
      - name: Reject a WSL-only package on native Windows
        shell: pwsh
        run: |
          $evidence = "$env:RUNNER_TEMP/loom-windows-e2e/native-explicit-feynman.txt"
          $stdout = "$evidence.stdout"
          $process = Start-Process cli/loom/target/release/loom.exe -ArgumentList "add", "--pi-package", "feynman", "--dry-run", "--yes" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $evidence
          Get-Content $stdout | Add-Content $evidence
          Remove-Item $stdout
          if ($process.ExitCode -eq 0) { throw "native feynman selection unexpectedly succeeded" }
          if (-not (Select-String -Quiet -Path $evidence -Pattern "feynman requires WSL2 on Windows")) {
            throw "native feynman rejection did not explain WSL2"
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loom-linux-x64
          path: loom-linux
      - name: Inspect WSL before installation
        timeout-minutes: 1
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          foreach ($option in @("version", "status")) {
            $evidence = "$evidenceDir/wsl-$option.txt"
            New-Item -ItemType File -Path $evidence -Force | Out-Null
            wsl "--$option" 2>&1 | Tee-Object -FilePath $evidence
            $code = $LASTEXITCODE
            if ($code -ne 0) { exit $code }
          }
      - name: Discover WSL distributions
        id: wsl-discovery
        timeout-minutes: 1
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          New-Item -ItemType File -Path "$evidenceDir/wsl-list-quiet.txt" -Force | Out-Null
          $listing = @(wsl --list --quiet 2>&1 | Tee-Object -FilePath "$evidenceDir/wsl-list-quiet.txt")
          $code = $LASTEXITCODE
          $listing | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          $distros = $listing -replace "`0", "" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          "install_ubuntu=$($distros -notcontains 'Ubuntu')" >> $env:GITHUB_OUTPUT
      - name: Install Ubuntu in WSL if absent
        id: wsl-install
        if: steps.wsl-discovery.outputs.install_ubuntu == 'True'
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "$env:RUNNER_TEMP/loom-windows-e2e/wsl-install.txt" -Force | Out-Null
          # Microsoft recommends web download when the default install hangs:
          # https://learn.microsoft.com/windows/wsl/install
          wsl --install --web-download -d Ubuntu --no-launch 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/loom-windows-e2e/wsl-install.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Inspect Ubuntu WSL version
        id: wsl-version
        timeout-minutes: 1
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          $listing = @(wsl --list --verbose 2>&1 | Tee-Object -FilePath "$evidenceDir/wsl-list-before-conversion.txt")
          $code = $LASTEXITCODE
          $listing | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          $ubuntu = @($listing -replace "`0", "" | Where-Object { $_ -match '^\s*\*?\s*Ubuntu\s+' })
          if ($ubuntu.Count -ne 1 -or $ubuntu[0] -notmatch '^\s*\*?\s*Ubuntu\s+\S.*?\s+([12])\s*$') {
            throw "Expected exactly one Ubuntu distribution with WSL version 1 or 2"
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Convert Ubuntu to WSL2
        if: steps.wsl-version.outputs.version == '1'
        timeout-minutes: 5
        shell: pwsh
        run: |
          wsl --set-version Ubuntu 2 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/loom-windows-e2e/wsl-set-version.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Record WSL distribution status
        timeout-minutes: 1
        shell: pwsh
        run: |
          $listing = @(wsl --list --verbose 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/loom-windows-e2e/wsl-list.txt")
          $code = $LASTEXITCODE
          $listing | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          $ubuntu = @($listing -replace "`0", "" | Where-Object { $_ -match '^\s*\*?\s*Ubuntu\s+' })
          if ($ubuntu.Count -ne 1 -or $ubuntu[0] -notmatch '^\s*\*?\s*Ubuntu\s+\S.*?\s+2\s*$') {
            throw "Expected exactly one Ubuntu distribution running WSL version 2"
          }
      - name: Prepare the WSL candidate and fake Pi
        timeout-minutes: 1
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          function Convert-ToWslPath($path) {
            $drive = $path.Substring(0, 1).ToLower()
            "/mnt/$drive$($path.Substring(2).Replace('\', '/'))"
          }
          $linuxExe = (Resolve-Path loom-linux/loom).Path
          $linuxPath = Convert-ToWslPath $linuxExe
          $fakeDir = Join-Path $env:RUNNER_TEMP "loom-e2e-bin"
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          "#!/bin/sh`nexit 0`n" | Set-Content -Path (Join-Path $fakeDir "pi") -NoNewline
          $fakeLinuxPath = Convert-ToWslPath $fakeDir
          $command = "chmod +x '$linuxPath' '$fakeLinuxPath/pi' && PATH='${fakeLinuxPath}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' exec '$linuxPath' add --pi-package feynman --dry-run --yes"
          $command | Set-Content -Path "$evidenceDir/wsl-command.sh" -NoNewline
      - name: Run the checked-out Loom build inside the Ubuntu shell
        timeout-minutes: 2
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          $command = Get-Content -Raw "$evidenceDir/wsl-command.sh"
          wsl -d Ubuntu -- bash -lc "$command --loom-e2e-invalid-option" 2>&1 | Tee-Object -FilePath "$evidenceDir/wsl-invalid-option.txt"
          $code = $LASTEXITCODE
          if ($code -ne 2) { throw "Expected Loom's invalid-option exit 2 through WSL; got $code" }
          wsl -d Ubuntu -- bash -lc $command 2>&1 | Tee-Object -FilePath "$evidenceDir/wsl-feynman-plan.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          if (-not (Select-String -Quiet -Path "$evidenceDir/wsl-feynman-plan.txt" -SimpleMatch "would enter the Vault-scoped setup")) {
            throw "WSL plan omitted the vault-scoped setup handoff"
          }
      - name: Diagnose WSL installation failure
        if: always() && steps.wsl-install.outcome == 'failure'
        timeout-minutes: 1
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          foreach ($name in @("services", "events", "network")) {
            New-Item -ItemType File -Path "$evidenceDir/wsl-$name.txt" -Force | Out-Null
          }
          Get-Service | Where-Object { $_.Name -in @("WslService", "LxssManager", "vmcompute", "hns") } |
            Select-Object Name, Status, StartType | ConvertTo-Json | Set-Content "$evidenceDir/wsl-services.txt"
          # WSL 2.7.13 fetches this manifest before printing download progress.
          curl.exe --silent --fail --location --connect-timeout 5 --max-time 15 --output NUL --write-out "http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total}\n" https://raw.githubusercontent.com/microsoft/WSL/master/distributions/DistributionInfo.json | Set-Content "$evidenceDir/wsl-network.txt"
          $networkCode = $LASTEXITCODE
          "exit_code=$networkCode" | Add-Content "$evidenceDir/wsl-network.txt"
          $logs = @("System") + @(Get-WinEvent -ListLog * | Where-Object {
            $_.IsEnabled -and $_.LogName -match "Lxss|Hyper-V-Compute|Host-Network-Service"
          } | Select-Object -ExpandProperty LogName)
          foreach ($log in $logs) {
            $filter = @{ LogName = $log; StartTime = (Get-Date).AddMinutes(-10) }
            if ($log -eq "System") { $filter.ProviderName = "Service Control Manager" }
            try {
              # Metadata only: never upload event payloads, environment, or command lines.
              Get-WinEvent -FilterHashtable $filter -MaxEvents 20 -ErrorAction Stop |
                Select-Object TimeCreated, LogName, ProviderName, Id, LevelDisplayName |
                ConvertTo-Json -Compress | Add-Content "$evidenceDir/wsl-events.txt"
            } catch {
              if ($_.FullyQualifiedErrorId -notlike "NoMatchingEventsFound*") { throw }
              "No events in $log during the last ten minutes" | Add-Content "$evidenceDir/wsl-events.txt"
            }
          }
          if ($networkCode -ne 0) { exit $networkCode }
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-evidence
          path: ${{ runner.temp }}/loom-windows-e2e
          if-no-files-found: error

  unix:
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !inputs.published }}
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
        if: ${{ !inputs.published }}
      - name: Run the real bootstrap twice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOM_E2E_LOOM_BIN: ${{ !inputs.published && format('{0}/cli/loom/target/release/loom', github.workspace) || '' }}
          LOOM_REPO_DIR: ${{ !inputs.published && github.workspace || '' }}
          LOOM_E2E_PUBLISHED: ${{ inputs.published }}
          LOOM_MANIFEST_URL: https://raw.githubusercontent.com/Yassimba/loom/${{ inputs.checkout_ref || github.sha }}/manifest/loom.toml
        run: bash scripts/e2e-install-unix.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            engine: powershell
            skill: implement
            tokei: required
          - name: Windows ARM64
            runner: windows-11-arm
            engine: pwsh
            skill: tdd
            tokei: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !inputs.published }}
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
        if: ${{ !inputs.published }}
      - name: Run the real bootstrap twice
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOM_E2E_LOOM_BIN: ${{ !inputs.published && format('{0}/cli/loom/target/release/loom.exe', github.workspace) || '' }}
          LOOM_REPO_DIR: ${{ !inputs.published && github.workspace || '' }}
          LOOM_E2E_PUBLISHED: ${{ inputs.published }}
          LOOM_MANIFEST_URL: https://raw.githubusercontent.com/Yassimba/loom/${{ inputs.checkout_ref || github.sha }}/manifest/loom.toml
          LOOM_E2E_POWERSHELL: ${{ matrix.engine }}
          LOOM_E2E_SKILL: ${{ matrix.skill }}
          LOOM_E2E_TOKEI: ${{ matrix.tokei }}
        run: .\scripts\e2e-install-windows.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: error
