name: Full install smoke

on:
  pull_request:
    paths:
      - .github/workflows/full-install.yml
      - install.ps1
      - install.sh
      - manifest/**
      - scripts/e2e-install-*.ps1
      - scripts/e2e-install-*.sh
      - scripts/e2e-windows-*.py
      - cli/loom/**
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Called by release.yml once a release's binaries are uploaded.
  workflow_call:
    inputs:
      published:
        description: Exercise published binaries instead of building a candidate
        type: boolean
        default: false
      checkout_ref:
        description: Git ref to test after release pinning
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux-loom:
    if: ${{ !inputs.published }}
    name: Build Loom for WSL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loom-linux-x64
          path: cli/loom/target/release/loom

  windows-wsl:
    if: ${{ !inputs.published }}
    name: Windows UX and WSL2
    needs: linux-loom
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
      - name: Drive the native Windows prompt through ConPTY
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.5
          python scripts/e2e-windows-console.py cli/loom/target/release/loom.exe $env:RUNNER_TEMP/loom-windows-e2e
      - name: Reject a WSL-only package on native Windows
        shell: pwsh
        run: |
          $evidence = "$env:RUNNER_TEMP/loom-windows-e2e/native-explicit-feynman.txt"
          $stdout = "$evidence.stdout"
          $process = Start-Process cli/loom/target/release/loom.exe -ArgumentList "add", "--pi-package", "feynman", "--dry-run", "--yes" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $evidence
          Get-Content $stdout | Add-Content $evidence
          Remove-Item $stdout
          if ($process.ExitCode -eq 0) { throw "native feynman selection unexpectedly succeeded" }
          if (-not (Select-String -Quiet -Path $evidence -Pattern "feynman requires WSL2 on Windows")) {
            throw "native feynman rejection did not explain WSL2"
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loom-linux-x64
          path: loom-linux
      - name: Run the checked-out Loom build inside WSL2
        shell: pwsh
        run: |
          $evidenceDir = "$env:RUNNER_TEMP/loom-windows-e2e"
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $distros = @(wsl --list --quiet) -replace "`0", "" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if ($distros -notcontains "Ubuntu") {
            wsl --install -d Ubuntu --no-launch
            if ($LASTEXITCODE -ne 0) { throw "Ubuntu WSL installation failed" }
          }
          wsl --set-version Ubuntu 2
          wsl --list --verbose *> "$evidenceDir/wsl-list.txt"
          function Convert-ToWslPath($path) {
            $drive = $path.Substring(0, 1).ToLower()
            "/mnt/$drive$($path.Substring(2).Replace('\', '/'))"
          }
          $linuxExe = (Resolve-Path loom-linux/loom).Path
          $linuxPath = Convert-ToWslPath $linuxExe
          $fakeDir = Join-Path $env:RUNNER_TEMP "loom-e2e-bin"
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          "#!/bin/sh`nexit 0`n" | Set-Content -Path (Join-Path $fakeDir "pi") -NoNewline
          $fakeLinuxPath = Convert-ToWslPath $fakeDir
          $command = "chmod +x '$linuxPath' '$fakeLinuxPath/pi'; PATH='${fakeLinuxPath}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' '$linuxPath' add --pi-package feynman --dry-run --yes"
          wsl -d Ubuntu -- bash -lc $command *> "$evidenceDir/wsl-feynman-plan.txt"
          if ($LASTEXITCODE -ne 0) { throw "WSL feynman dry-run failed" }
          if (-not (Select-String -Quiet -Path "$evidenceDir/wsl-feynman-plan.txt" -SimpleMatch "would enter the Vault-scoped setup")) {
            throw "WSL plan omitted the vault-scoped setup handoff"
          }
      - name: Upload Windows E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-evidence
          path: ${{ runner.temp }}/loom-windows-e2e
          if-no-files-found: error

  unix:
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS ARM64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !inputs.published }}
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
        if: ${{ !inputs.published }}
      - name: Run the real bootstrap twice
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOM_E2E_LOOM_BIN: ${{ !inputs.published && format('{0}/cli/loom/target/release/loom', github.workspace) || '' }}
          LOOM_REPO_DIR: ${{ !inputs.published && github.workspace || '' }}
          LOOM_E2E_PUBLISHED: ${{ inputs.published }}
        run: bash scripts/e2e-install-unix.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request' || !startsWith(github.event.pull_request.head.ref, 'release-please--')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            engine: powershell
            skill: next
            tokei: required
          - name: Windows ARM64
            runner: windows-11-arm
            engine: pwsh
            skill: tdd
            tokei: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !inputs.published }}
      - run: cargo build --release --manifest-path cli/loom/Cargo.toml
        if: ${{ !inputs.published }}
      - name: Run the real bootstrap twice
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOM_E2E_LOOM_BIN: ${{ !inputs.published && format('{0}/cli/loom/target/release/loom.exe', github.workspace) || '' }}
          LOOM_REPO_DIR: ${{ !inputs.published && github.workspace || '' }}
          LOOM_E2E_PUBLISHED: ${{ inputs.published }}
          LOOM_E2E_POWERSHELL: ${{ matrix.engine }}
          LOOM_E2E_SKILL: ${{ matrix.skill }}
          LOOM_E2E_TOKEI: ${{ matrix.tokei }}
        run: .\scripts\e2e-install-windows.ps1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-install-${{ matrix.name }}
          path: ${{ runner.temp }}/loom-install-e2e
          if-no-files-found: error
