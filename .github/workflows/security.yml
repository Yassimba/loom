name: Security

# Two scanners, one gate:
#  - osv-scanner: known vulnerabilities in every lockfile (npm, both
#    Cargo.locks, pinned GitHub Actions) against the OSV database.
#  - SkillSpector: static scan of every public skill for malicious
#    patterns (prompt injection, exfiltration, curl|bash, obfuscation).
# Renovate automerge is gated on this workflow passing, so "no
# vulnerability found" is enforced, not assumed.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  skill-scan:
    runs-on: ubuntu-latest
    env:
      # CI runners can't finish the largest skills in SkillSpector's 60s
      # default, which fail-closes the scan (exit 2, coverage 0%).
      SKILLSPECTOR_MAX_WORKFLOW_SECONDS: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR checkouts are the merge commit, so HEAD^1 is the base tip
          fetch-depth: 2
      - name: Cache SkillSpector install
        id: spector-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/pipx/venvs/skillspector
          # any workflow change (pin bump, deadline tweak) invalidates the cache
          key: skillspector-${{ hashFiles('.github/workflows/security.yml') }}
      - name: Install SkillSpector
        if: steps.spector-cache.outputs.cache-hit != 'true'
        run: pipx install "git+https://github.com/NVIDIA/skillspector.git@c7958a3268d9498644b22edb75d0f051bbc8cbfc" # v2.12.0
      - name: Put the cached SkillSpector venv on PATH
        # cache restores the venv but not the pipx shim; use the venv bin
        run: echo "$(pipx environment --value PIPX_LOCAL_VENVS)/skillspector/bin" >> "$GITHUB_PATH"
      - name: Scan public skills (static analysis)
        # Exit 1 when any skill scores >50 (DO_NOT_INSTALL). drafts/ and
        # personal/ are not install surfaces, so they don't gate CI. A skill
        # may carry a reviewed .skillspector-baseline.yaml of glob rules
        # (id + path + reason) suppressing accepted false positives; only
        # new findings gate after that.
        # PRs scan only skills whose files changed vs the base branch;
        # the weekly schedule and manual dispatch sweep everything.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            dirs=$(git diff --name-only HEAD^1 HEAD -- skills/ | cut -d/ -f1-2 | sort -u | sed 's|$|/|')
          else
            dirs=$(printf '%s\n' skills/*/)
          fi
          [ -z "$dirs" ] && { echo "No skill changes — nothing to scan."; exit 0; }
          fail=0
          for d in $dirs; do
            [ -d "$d" ] || continue  # skill was deleted in this PR
            args=(--no-llm)
            [ -f "$d.skillspector-baseline.yaml" ] && args+=(--baseline "$d.skillspector-baseline.yaml")
            echo "::group::$d"
            skillspector scan "$d" "${args[@]}" || fail=1
            echo "::endgroup::"
          done
          exit $fail
