name: Release

# release-please keeps one PR per changed component (version bump, changelog,
# manifest pin). Merging it tags `<component>-vX.Y.Z`; the jobs below then
# upload the Rust binaries and publish the npm package for that tag.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      binaries: ${{ steps.binaries.outputs.matrix }}
      released: ${{ steps.release.outputs.releases_created }}
      npm: ${{ steps.release.outputs['plugins/openai-fast--release_created'] }}
      npm_sha: ${{ steps.release.outputs['plugins/openai-fast--sha'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - id: binaries
        name: Expand released Rust crates into a target matrix
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          matrix=$(jq -c '
            [to_entries[] | select(.key | test("^cli/.*--tag_name$"))
              | {crate: (.key | sub("^cli/"; "") | sub("--tag_name$"; "")), tag: .value}]
            | [.[] as $crate | (
                {target: "aarch64-apple-darwin", os: "macos-latest"},
                {target: "x86_64-apple-darwin", os: "macos-latest"},
                {target: "x86_64-unknown-linux-gnu", os: "ubuntu-latest"},
                {target: "aarch64-unknown-linux-gnu", os: "ubuntu-latest"},
                {target: "x86_64-pc-windows-msvc", os: "windows-latest"},
                {target: "aarch64-pc-windows-msvc", os: "windows-latest"}
              ) | . + $crate]' <<<"$OUTPUTS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  binaries:
    needs: release-please
    if: needs.release-please.outputs.binaries != '[]'
    name: ${{ matrix.crate }} · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.binaries) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ matrix.tag }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: ${{ matrix.crate }}
          manifest-path: cli/${{ matrix.crate }}/Cargo.toml
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          ref: refs/tags/${{ matrix.tag }}
          token: ${{ github.token }}

  npm:
    needs: release-please
    if: needs.release-please.outputs.npm == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.npm_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish ./plugins/openai-fast --access public --provenance

  # Smoke the real installers on every platform against the freshly
  # published binaries; skipped when nothing was released.
  full-install:
    needs: [release-please, binaries]
    if: needs.release-please.outputs.released == 'true' && !cancelled() && needs.binaries.result != 'failure'
    uses: ./.github/workflows/full-install.yml
