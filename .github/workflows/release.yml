name: Release

# release-please keeps one PR per changed component (version bump, changelog).
# Merging it tags `<component>-vX.Y.Z`; the jobs below upload the Rust
# binaries, move the manifest pin to the new tag, and publish npm.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      binaries: ${{ steps.binaries.outputs.matrix }}
      released: ${{ steps.release.outputs.releases_created }}
      npm: ${{ steps.release.outputs['plugins/openai-fast--release_created'] }}
      npm_sha: ${{ steps.release.outputs['plugins/openai-fast--sha'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - id: binaries
        name: Expand released Rust crates into a target matrix
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          matrix=$(jq -c '
            [to_entries[] | select(.key | test("^cli/.*--tag_name$"))
              | {crate: (.key | sub("^cli/"; "") | sub("--tag_name$"; "")), tag: .value}]
            | [.[] as $crate | (
                {target: "aarch64-apple-darwin", os: "macos-latest"},
                {target: "x86_64-apple-darwin", os: "macos-latest"},
                {target: "x86_64-unknown-linux-gnu", os: "ubuntu-latest"},
                {target: "aarch64-unknown-linux-gnu", os: "ubuntu-latest"},
                {target: "x86_64-pc-windows-msvc", os: "windows-latest"},
                {target: "aarch64-pc-windows-msvc", os: "windows-latest"}
              ) | . + $crate]' <<<"$OUTPUTS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  binaries:
    needs: release-please
    if: needs.release-please.outputs.binaries != '[]'
    name: ${{ matrix.crate }} · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-please.outputs.binaries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: ${{ matrix.crate }}
          manifest-path: cli/${{ matrix.crate }}/Cargo.toml
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          ref: refs/tags/${{ matrix.tag }}
          token: ${{ github.token }}

  npm:
    needs: release-please
    if: needs.release-please.outputs.npm == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.npm_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish ./plugins/openai-fast --access public --provenance

  # Only after every asset is up: point the published manifest at the new
  # tags, so `loom update` and fresh installs never see a release without
  # binaries.
  pin:
    needs: [release-please, binaries]
    if: needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # deploy key: main's ruleset requires PRs but lets deploy keys
          # push pin commits directly
          ssh-key: ${{ secrets.AUTOFIX_SSH_KEY }}
      - env:
          MATRIX: ${{ needs.release-please.outputs.binaries }}
        run: |
          jq -r '.[] | "\(.crate) \(.tag)"' <<<"$MATRIX" | sort -u | while read -r crate tag; do
            sed -i "s|^\(\"github:Yassimba/loom\[exe=$crate\]\" = { version = \"\)[^\"]*|\1$tag|" manifest/loom.toml
            # loom-teams lives on the ubi backend (see manifest/loom.toml): version first, exe after.
            sed -i "s|^\(\"ubi:Yassimba/loom\" = { version = \"\)[^\"]*\(\", exe = \"$crate\"\)|\1$tag\2|" manifest/loom.toml
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore(manifest): pin released binaries" && git push

  # Smoke the real installers on every platform against the freshly
  # published binaries and pins.
  full-install:
    needs: pin
    uses: ./.github/workflows/full-install.yml
