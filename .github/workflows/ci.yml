name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: bash -n install.sh

  powershell-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Parse installer
        shell: powershell
        run: '[scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null'

  rust-linux:
    name: rust · ${{ matrix.crate }} · linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [loom, loom-teams]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli/${{ matrix.crate }}
      - run: cargo fmt --manifest-path cli/${{ matrix.crate }}/Cargo.toml -- --check
      - run: cargo clippy --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-features

  rust-windows:
    name: rust · ${{ matrix.crate }} · windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [loom, loom-teams]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli/${{ matrix.crate }}
      - run: cargo test --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-features
      # Type-check the aarch64 Windows release target without a full build.
      - run: cargo check --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-features --target aarch64-pc-windows-msvc

  result:
    if: always()
    needs: [quality, powershell-installer, rust-linux, rust-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          QUALITY: ${{ needs.quality.result }}
          POWERSHELL: ${{ needs.powershell-installer.result }}
          RUST_LINUX: ${{ needs.rust-linux.result }}
          RUST_WINDOWS: ${{ needs.rust-windows.result }}
        run: |
          test "$QUALITY" = success
          test "$POWERSHELL" = success
          test "$RUST_LINUX" = success
          test "$RUST_WINDOWS" = success
