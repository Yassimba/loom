name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: bash -n install.sh

  powershell-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse installer
        shell: powershell
        run: '[scriptblock]::Create((Get-Content install.ps1 -Raw)) | Out-Null'

  rust:
    name: rust · ${{ matrix.crate }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [loom, loom-teams]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - if: matrix.crate == 'loom'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: matrix.crate == 'loom'
        run: npm ci
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli/${{ matrix.crate }}
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path cli/${{ matrix.crate }}/Cargo.toml -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-features
      - if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --manifest-path cli/${{ matrix.crate }}/Cargo.toml --all-features --target aarch64-pc-windows-msvc

  result:
    if: always()
    needs: [quality, powershell-installer, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI job
        env:
          QUALITY: ${{ needs.quality.result }}
          POWERSHELL: ${{ needs.powershell-installer.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$QUALITY" = success
          test "$POWERSHELL" = success
          test "$RUST" = success
