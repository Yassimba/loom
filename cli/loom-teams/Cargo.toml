[package]
name = "loom-teams"
version = "0.2.0"
edition = "2021"
description = "Teams/Outlook calendar data over Microsoft Graph: export meetings as JSON, find slots. Personal prototype — not for release."
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
chromiumoxide = { version = "0.9", default-features = false }
futures = "0.3"
jiff = "0.2"
percent-encoding = "2"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
dirs = "6"
hex = "0.4.3"
keyring = "4.2"

[profile.release]
lto = true
strip = true
