[package]
name = "loom"
version = "0.19.0"
edition = "2021"
description = "Install and manage Yassimba's curated agent skills, Pi packages, and Herdr plugins"
license = "MIT"
repository = "https://github.com/Yassimba/loom"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.5"
# ratatui's crossterm, with input read by polling /dev/tty instead of mio:
# macOS kqueue cannot watch the /dev/tty device node, which is exactly what
# stdin is after `curl … | sh` reattaches the terminal (`loom setup </dev/tty`).
crossterm = { version = "0.28", features = ["use-dev-tty"] }
dirs = "6"
inquire = "0.7"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
unicode-width = "0.2"

[dev-dependencies]
pretty_assertions = "=1.4.1"
