[package]
name = "stackdiff"
version = "0.1.0"
edition = "2021"
description = "Diff call stacks across git commits, or print one world's call tree (--tree). Rust port of npm calldiff by Tanishq Kancharla (MIT)."
license = "MIT"
repository = "https://github.com/Yassimba/loom"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
rayon = "1.12.0"
terminal_size = "0.4.4"
mermaid-text = "0.57.0"
toml = "1.1.4"
clap_complete = "4.6.9"
dialoguer = "0.12.0"
